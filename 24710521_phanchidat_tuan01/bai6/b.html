<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .outer-box {
            border: 1px solid #7799bb;
            width: 550px;
            padding: 15px;
        }
        h2 {
            margin-top: 0;
            font-size: 24px;
            font-family: "Times New Roman", Times, serif;
        }
        fieldset {
            border: 1px solid #999;
            margin-bottom: 15px;
            padding: 10px 15px;
        }
        legend {
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
        }
        .form-group label {
            width: 90px;
            font-size: 13px;
        }
        .form-group input[type="text"], 
        .form-group input[type="email"] {
            width: 200px;
            padding: 2px;
        }
        .form-group textarea {
            width: 300px;
            height: 120px;
        }
        .newsletter-label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        input[type="submit"] {
            background-color: #f0f0f0;
            border: 1px solid #777;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="outer-box">
    <h2>Contact Us</h2>
    
    <form action="#" method="post" enctype="multipart/form-data">
        <!-- Nhóm nội dung tin nhắn -->
        <fieldset>
            <legend>Your message</legend>
            
            <div class="form-group">
                <label>To</label>
                <input type="text" name="to" value="Example Cafe">
            </div>
            
            <div class="form-group">
                <label>Your email</label>
                <input type="email" name="email">
            </div>
            
            <div class="form-group">
                <label>Message</label>
                <textarea name="message"></textarea>
            </div>
            
            <div class="form-group">
                <label>Attach File</label>
                <input type="file" name="attachment">
            </div>
        </fieldset>

        <!-- Nhóm nội dung khảo sát -->
        <fieldset>
            <legend>How you found us</legend>
            
            <div class="form-group">
                <label style="width: 130px;">How did you hear of us</label>
                <select name="source">
                    <option value="google">Google</option>
                    <option value="facebook">Facebook</option>
                    <option value="friend">Friend</option>
                </select>
            </div>
            
            <div class="form-group">
                <label style="width: 130px;">Newsletter</label>
                <label class="newsletter-label">
                    <input type="checkbox" name="subscribe" checked> 
                    Ensure this box is checked if you would like to receive email updates
                </label>
            </div>
        </fieldset>

        <input type="submit" value="Send message">
    </form>
</div>

</body>
</html>
