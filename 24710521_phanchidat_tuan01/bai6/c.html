<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Date</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .date-form-container {
            border: 1px solid #999;
            width: 250px;
            padding: 20px;
            box-sizing: border-box;
        }
        .input-block {
            margin-bottom: 15px;
        }
        .input-block label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-block input[type="text"],
        .input-block input[type="tel"],
        .input-block input[type="email"],
        .input-block input[type="date"] {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            border: 1px solid #888;
        }
        /* Tùy chỉnh ô chọn màu giống trong hình */
        input[type="color"] {
            width: 40px;
            height: 20px;
            padding: 0;
            border: 1px solid #000;
            cursor: pointer;
        }
        .button-center {
            text-align: center;
            margin-top: 20px;
        }
        .button-center input {
            padding: 3px 15px;
            background-color: #f0f0f0;
            border: 1px solid #777;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="date-form-container">
    <form action="#" method="post">
        
        <div class="input-block">
            <label>Name:</label>
            <input type="text" name="username">
        </div>

        <div class="input-block">
            <label>Telephone Number:</label>
            <input type="tel" name="phone">
        </div>

        <div class="input-block">
            <label>Email:</label>
            <input type="email" name="user_email">
        </div>

        <div class="input-block">
            <label>Favorite Color:</label>
            <!-- Ô chọn màu sắc -->
            <input type="color" name="favcolor" value="#0000ff">
        </div>

        <div class="input-block">
            <label>Date of Birth:</label>
            <!-- Ô chọn ngày tháng (khi click vào sẽ tự hiện bảng lịch giống trong hình) -->
            <input type="date" name="dob" value="2015-07-16">
        </div>

        <div class="button-center">
            <input type="submit" value="Submit">
        </div>

    </form>
</div>

</body>
</html>
